# Render Blueprint for the Aasha Setu backend (FastAPI + SSE).
# The frontend deploys separately on Cloudflare Pages (static export); the
# database is Supabase (PostGIS).
#
# In the Render dashboard, set the `sync: false` vars after the first deploy:
#   DATABASE_URL   - Supabase "Connection string", Session pooler (port 5432) —
#                    NOT the Transaction pooler (6543), it breaks migrations;
#                    a bare postgres:// URL is auto-rewritten by app/config.py
#   LLM_API_KEY    - your Gemini API key (optional; chat falls back without it)
#
# CORS_ORIGINS (below) lists the frontend URLs allowed to call the API,
# comma-separated. Edit it here and push — Render applies it on sync, and a
# dashboard edit would be overwritten.
services:
  - type: web
    name: drishti-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker only — the SSE broker keeps state in-process. On every boot:
    # run migrations (no-op when already at head), then seed the demo data
    # (idempotent — skips tables that already have rows). Render's free tier
    # has no shell, so this is how the demo data gets in.
    startCommand: sh -c "alembic upgrade head && python -m app.scripts.seed_demo_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aasha-setu.pages.dev,https://ai-disaster-managementandresponse-platform-preachers1.vercel.app
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: ENVIRONMENT
        value: production
